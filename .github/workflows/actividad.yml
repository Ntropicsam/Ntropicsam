name: Actividad

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dibujar el calendario
        run: node scripts/actividad.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_PERFIL_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USUARIO: Ntropicsam
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/actividad.svg
          git diff --cached --quiet || (git commit -m "Actividad: calendario actualizado" && git push)
